<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The PO Race — Axya booth game</title>
<style>
  :root{
    /* legacy world */
    --erp-chrome:#c9ced6;
    --erp-chrome-hi:#e3e7ec;
    --erp-title:#1f3864;
    --erp-grid:#ffffff;
    --erp-zebra:#eef1f6;
    --erp-line:#98a2b0;
    --erp-line-soft:#c2c9d3;
    --erp-text:#15181c;
    --erp-sel:#2b5797;
    --erp-alert:#9c1006;
    /* axya world */
    --ax-canvas:#FAFAF8;
    --ax-ink:#14181C;
    --ax-mute:#6B7280;
    --ax-accent:#4B3BFF;
    --ax-accent-soft:#EEEBFF;
    --ax-revise:#B4342A;
    --ax-revise-soft:#FBEDEB;
    --ax-rule:#E3E2DD;
    /* Axya brand system */
    --blue:#2682FD;
    --bblue:#EBF3FF;
    --grey:#F4F4F8;
    --dark:#12123A;
    --mid:#4A4A6A;
    --muted:#9090B0;
    --green:#22C55E;
    --orange:#E07030;
    --warn-bg:#FFF7ED;
    --warn-bd:#FED7AA;
    --succ-bg:#F0FBF4;
    --succ-bd:#86EFAC;
    --red:#DC2626;
    --red-bg:#FEF2F2;
    --red-bd:#FECACA;
    --card-bd:#E4E4F0;
    --divider:#D8D8EC;
    --divider-blue:#C8D8F8;
    --brandfont:"Google Sans Flex","Google Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#FFFFFF; color:var(--dark);
    font-family:var(--brandfont);
    -webkit-font-smoothing:antialiased;
  }
  #app{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ax-accent);outline-offset:1px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ============ BRAND SCREENS ============ */
  .stage{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;
         padding:48px 32px;background:#FFFFFF}
  .stage-inner{width:100%;max-width:900px}
  .kicker{font-size:13px;font-weight:700;color:var(--blue);margin:0 0 16px;text-transform:uppercase}
  h1.big{
    font-size:clamp(30px,4.6vw,52px);line-height:1.1;font-weight:400;color:var(--dark);
    margin:0 0 20px;max-width:22ch;
  }
  h1.big em{font-style:normal;color:var(--muted)}
  .lede{font-size:17px;line-height:1.6;color:var(--mid);max-width:64ch;margin:0 0 32px;font-weight:400}
  .fineprint{color:var(--muted);font-size:13px;margin-top:24px;line-height:1.6}

  .cta{
    background:var(--blue);color:#fff;border:0;padding:15px 32px;
    font-size:15px;font-weight:700;border-radius:11px;font-family:inherit;
  }
  .cta:hover{background:#1570E6}
  .cta.ghost{background:#fff;border:1px solid var(--card-bd);color:var(--mid)}
  .cta.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  /* numbered instruction rows */
  .rules{margin:0 0 30px}
  .rule{display:flex;gap:15px;padding:14px 0;border-bottom:1px solid var(--divider);align-items:flex-start}
  .rule:first-child{border-top:1px solid var(--divider)}
  .rule-n{
    width:26px;height:26px;flex:none;border-radius:50%;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .rule-t{font-size:15px;line-height:1.45;color:var(--dark);font-weight:700;padding-top:3px}
  .rule-t small{display:block;color:var(--mid);font-size:13.5px;font-weight:400;margin-top:4px;line-height:1.5}

  /* cards */
  .bcard{background:var(--grey);border:1px solid var(--card-bd);border-radius:18px;
         box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .bcard.blue{background:var(--bblue);border-color:var(--blue);border-width:1.5px}
  .bcard.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
  .bcard.succ{background:var(--succ-bg);border-color:var(--succ-bd)}
  .accentbar{width:31px;height:6px;border-radius:3px;background:var(--blue);margin-bottom:16px}

  /* stat cards */
  .metric-row{display:flex;gap:14px;margin:0 0 30px;flex-wrap:wrap}
  .metric{flex:1;min-width:170px;background:var(--grey);border:1px solid var(--card-bd);
          border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:20px 22px}
  .metric-v{font-size:42px;font-weight:400;color:var(--dark);line-height:1;
            font-variant-numeric:tabular-nums;margin-bottom:12px}
  .metric-v small{font-size:16px;color:var(--mid);margin-left:5px}
  .metric-l{font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:10px}
  .metric-d{font-size:11.5px;color:var(--mid);padding-top:9px;border-top:1px solid var(--divider);line-height:1.5}

  /* term/definition rows for the miss list */
  .miss-list{margin:0 0 30px}
  .miss{
    display:flex;align-items:center;gap:14px;background:var(--grey);border:1px solid var(--card-bd);
    border-radius:12px;padding:13px 16px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .miss-po{font-size:12.5px;font-weight:700;color:var(--dark);min-width:112px;flex:none;
           font-variant-numeric:tabular-nums}
  .miss-txt{font-size:12.5px;color:var(--mid);line-height:1.5;flex:1}
  .miss-txt b{color:var(--dark);font-weight:700;font-variant-numeric:tabular-nums}
  .vpill{font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:9px;flex:none}
  .vpill.caught{background:var(--succ-bg);border:1px solid var(--succ-bd);color:#12813F}
  .vpill.missed{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}

  /* final verdict */
  .headline-num{font-size:clamp(52px,8.5vw,96px);font-weight:400;color:var(--dark);
                line-height:1;margin:0 0 12px;font-variant-numeric:tabular-nums}
  .headline-sub{font-size:18px;color:var(--mid);line-height:1.55;max-width:58ch;margin:0 0 34px}
  .bars{margin:0 0 32px}
  .bar-row{margin-bottom:16px}
  .bar-lab{font-size:12.5px;color:var(--mid);margin-bottom:7px;display:flex;justify-content:space-between}
  .bar-lab b{color:var(--dark);font-weight:700;font-variant-numeric:tabular-nums}
  .bar-track{height:14px;background:var(--grey);border-radius:7px;overflow:hidden}
  .bar-fill{height:100%;border-radius:7px;transition:width .9s cubic-bezier(.2,.7,.3,1)}
  .verdict{display:flex;gap:14px;margin:0 0 30px;flex-wrap:wrap}
  .vcol{flex:1;min-width:210px;border-radius:18px;padding:22px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .vcol.without{background:var(--warn-bg);border:1px solid var(--warn-bd)}
  .vcol.with{background:var(--bblue);border:1.5px solid var(--blue)}
  .vcol-l{font-size:11.5px;font-weight:700;margin-bottom:14px;text-transform:uppercase}
  .vcol.without .vcol-l{color:var(--orange)}
  .vcol.with .vcol-l{color:var(--blue)}
  .vcol-time{font-size:46px;font-weight:400;color:var(--dark);line-height:1;
             font-variant-numeric:tabular-nums;margin-bottom:12px}
  .vcol-acc{font-size:12.5px;color:var(--mid);line-height:1.5;padding-top:10px;border-top:1px solid var(--divider)}
  .vcol.with .vcol-acc{border-top-color:var(--divider-blue)}
  .vcol-acc .ok{color:#12813F;font-weight:700}

  /* ============ APP CHROME (round header) ============ */  /* ============ APP CHROME (round header) ============ */
  .bar{
    display:flex;align-items:center;gap:20px;padding:0 14px;height:46px;flex:none;
    background:var(--dark);border-bottom:1px solid #24244E;color:#fff;
    font-family:var(--brandfont);
  }
  .bar-mode{font-size:13px;font-weight:640;letter-spacing:.01em}
  .bar-mode .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .bar-prog{font-size:12.5px;color:#A8A8C8;font-variant-numeric:tabular-nums}
  .clock{
    margin-left:auto;font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;
    letter-spacing:.01em;padding-right:4px;
  }
  .btn-finish{
    background:#fff;color:var(--dark);border:0;padding:9px 20px;border-radius:8px;
    font-size:14px;font-weight:700;font-family:inherit;
  }
  .btn-finish:hover{background:var(--bblue)}
  .btn-start{background:var(--blue);color:#fff;border:0;padding:9px 22px;border-radius:8px;
             font-size:14px;font-weight:700;font-family:inherit}
  .btn-start:hover{background:#1570E6}
  .clock.idle{color:#6A6A96}
  .split{position:relative}

  .split{flex:1;display:flex;min-height:0}
  .pane-l{width:52%;min-width:0;display:flex;flex-direction:column;border-right:1px solid #000}
  .pane-r{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ============ LEGACY ERP ============ */
  .erp{
    background:var(--erp-chrome);color:var(--erp-text);height:100%;
    font-family:Tahoma,Verdana,"Segoe UI",sans-serif;font-size:11px;
    display:flex;flex-direction:column;min-height:0;
  }
  .erp-title{
    background:var(--erp-title);color:#fff;padding:4px 8px;font-size:11px;font-weight:700;
    display:flex;justify-content:space-between;align-items:center;flex:none;
  }
  .erp-title span{font-weight:400;opacity:.75}
  .erp-menu{
    background:var(--erp-chrome-hi);border-bottom:1px solid var(--erp-line);
    padding:3px 6px;display:flex;gap:14px;flex:none;color:#2c3138;
  }
  .erp-menu u{text-decoration-thickness:1px;text-underline-offset:1px}
  .erp-toolbar{
    background:var(--erp-chrome);border-bottom:2px groove #fff;padding:5px 6px;
    display:flex;gap:6px;align-items:center;flex:none;
  }
  .erp-btn{
    background:var(--erp-chrome-hi);border:1px solid var(--erp-line);padding:2px 9px;
    font-family:inherit;font-size:11px;border-radius:0;color:#2c3138;
  }
  .erp-btn:hover{background:#f2f5f9}
  .erp-btn:active{border-style:inset}
  .erp-search{
    border:1px inset var(--erp-line);background:#fff;padding:2px 5px;font-family:inherit;font-size:11px;width:130px;
  }
  .erp-secthead{
    background:var(--erp-chrome);padding:3px 7px;font-weight:700;font-size:11px;
    border-bottom:1px solid var(--erp-line);border-top:1px solid #fff;flex:none;color:#2c3138;
  }
  .erp-scroll{overflow-y:auto;background:var(--erp-grid);min-height:0}
  table.erp-grid{border-collapse:collapse;width:100%;background:var(--erp-grid)}
  table.erp-grid th{
    background:var(--erp-chrome-hi);border:1px solid var(--erp-line-soft);border-top:0;
    padding:3px 6px;text-align:left;font-size:11px;font-weight:700;position:sticky;top:0;z-index:2;color:#2c3138;
  }
  table.erp-grid td{border:1px solid #e2e6ec;padding:2px 6px;white-space:nowrap;font-size:11px}
  table.erp-grid tr:nth-child(even) td{background:var(--erp-zebra)}
  table.erp-grid tr.po-row{cursor:default}
  table.erp-grid tr.po-row:hover td{background:#dbe6f7}
  table.erp-grid tr.sel td,table.erp-grid tr.sel:hover td{background:var(--erp-sel);color:#fff}
  table.erp-grid tr.erp-hl td{background:#ffeaa0;box-shadow:inset 0 -1px 0 #d9a900,inset 0 1px 0 #d9a900}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .erp-empty{padding:22px 14px;color:#5d6570;background:var(--erp-grid);font-size:11px}
  .erp-input{
    font-family:Tahoma,Verdana,sans-serif;font-size:11px;border:1px inset var(--erp-line);
    background:#fff;padding:1px 3px;width:100%;border-radius:0;
  }
  .erp-input.q{width:56px;text-align:right}
  .erp-input.p{width:68px;text-align:right}
  .erp-input.d{width:112px}
  .erp-input.touched{background:#fffbdd}
  .erp-status{
    background:var(--erp-chrome);border-top:1px solid #fff;padding:3px 8px;font-size:11px;
    display:flex;justify-content:space-between;color:#3a4048;flex:none;
  }
  .saved{color:#0a6b2e;font-weight:700}

  /* ============ OUTLOOK ============ */
  .ol{background:#fff;height:100%;display:flex;flex-direction:column;min-height:0;
      font-family:"Segoe UI",Tahoma,Verdana,sans-serif;font-size:12px;color:#201f1e}
  .ol-title{background:#2b579a;color:#fff;height:25px;display:flex;align-items:center;
            padding:0 9px;font-size:11.5px;flex:none;gap:8px}
  .ol-title .sq{width:9px;height:9px;background:#fff;opacity:.85;flex:none}
  .ol-tabs{background:#2b579a;display:flex;padding:0 5px;flex:none;align-items:flex-end;height:24px}
  .ol-tab{padding:4px 12px;font-size:11.5px;color:#c7d6ec}
  .ol-tab.on{background:#f3f2f1;color:#2b579a;font-weight:600}
  .ol-ribbon{background:#f3f2f1;border-bottom:1px solid #e1dfdd;padding:5px 7px;
             display:flex;gap:2px;align-items:center;flex:none}
  .ol-cmd{background:transparent;border:1px solid transparent;padding:4px 9px;font-family:inherit;
          font-size:11.5px;color:#201f1e;border-radius:2px;display:flex;align-items:center;gap:5px}
  .ol-cmd:hover{background:#e1dfdd;border-color:#c8c6c4}
  .ol-cmd .ic{color:#2b579a;font-size:12px;line-height:1}
  .ol-cmd .ic.red{color:#a4262c}
  .ol-body{flex:1;display:flex;min-height:0}
  .ol-folders{width:122px;flex:none;background:#f3f2f1;border-right:1px solid #e1dfdd;padding:9px 0;font-size:11.5px}
  .ol-fgroup{padding:2px 10px 6px;color:#605e5c;font-size:11px}
  .ol-fold{padding:4px 10px 4px 13px;display:flex;justify-content:space-between;gap:6px;color:#201f1e;border-left:3px solid transparent}
  .ol-fold.on{background:#deecf9;font-weight:600;border-left-color:#2b579a}
  .ol-fold b{color:#2b579a;font-weight:600}
  .ol-main{flex:1;display:flex;flex-direction:column;min-width:0}
  .ol-listhdr{background:#fff;border-bottom:1px solid #edebe9;padding:6px 11px;font-size:11.5px;
              display:flex;justify-content:space-between;color:#605e5c;flex:none}
  .ol-listhdr b{color:#201f1e;font-weight:600}
  .ol-list{overflow-y:auto;min-height:0;flex:0 0 44%;border-bottom:1px solid #e1dfdd;background:#fff}
  .ol-msg{display:flex;gap:8px;padding:7px 11px 7px 8px;border-bottom:1px solid #f3f2f1;
          cursor:pointer;border-left:3px solid transparent;align-items:flex-start}
  .ol-msg:hover{background:#f3f2f1}
  .ol-msg.unread{border-left:4px solid #0078d4;padding-left:7px;background:#EFF6FE}
  .ol-msg.unread:hover{background:#E3EFFC}
  .ol-msg.unread .ol-from{color:#0078d4;font-weight:700}
  .ol-msg.unread .ol-subj{font-weight:700;color:#12123A}
  .ol-msg.unread .ol-clip{color:#0078d4}
  .ol-msg:not(.unread) .ol-from{color:#6B6B70;font-weight:400}
  .ol-msg:not(.unread) .ol-subj{color:#57575C}
  .ol-msg:not(.unread) .ol-prev{color:#8A8A90}
  .ol-msg.sel,.ol-msg.sel:hover{background:#cce4f7}
  .ol-col{flex:1;min-width:0}
  .ol-from{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .ol-date{color:#605e5c;font-size:11px;font-weight:400;flex:none}
  .ol-subj{font-size:11.5px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ol-prev{font-size:11px;color:#605e5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ol-clip{color:#605e5c;font-size:12px;flex:none;padding-top:2px}
  .ol-read{flex:1;overflow-y:auto;padding:15px 20px;min-height:0;background:#fff}
  .ol-rsubj{font-size:17px;font-weight:600;margin:0 0 13px;line-height:1.3}
  .ol-sender{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}
  .ol-av{width:32px;height:32px;border-radius:50%;background:#2b579a;color:#fff;flex:none;
         display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .ol-sname{font-size:12.5px;font-weight:600}
  .ol-saddr{font-size:11.5px;color:#605e5c}
  .ol-when{margin-left:auto;font-size:11.5px;color:#605e5c;flex:none;text-align:right}
  .ol-acts{display:flex;gap:16px;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid #edebe9}
  .ol-act{background:none;border:0;color:#2b579a;font-size:11.5px;padding:0;font-family:inherit}
  .ol-act:hover{text-decoration:underline}
  .ol-text{font-size:12.5px;line-height:1.7;white-space:pre-wrap}
  .ol-attach{margin-top:17px;padding-top:12px;border-top:1px solid #edebe9}
  .ol-attach-lab{font-size:11px;color:#605e5c;margin-bottom:7px}
  .ol-chip{display:inline-flex;align-items:center;gap:9px;border:1px solid #e1dfdd;background:#faf9f8;
           padding:8px 13px;font-family:inherit;font-size:11.5px;border-radius:2px;color:#201f1e}
  .ol-chip:hover{background:#f3f2f1;border-color:#2b579a}
  .ol-empty{color:#605e5c;font-size:12px;padding:10px 0}
  .ol-status{background:#2b579a;color:#fff;font-size:11px;padding:3px 10px;display:flex;
             justify-content:space-between;flex:none}
  .pdf-ico{background:#a4262c;color:#fff;font-size:8.5px;font-weight:700;padding:2px 4px;letter-spacing:.02em}

  /* ============ SETUP PANEL ============ */
  .setup-veil{position:fixed;inset:0;background:rgba(18,18,58,.5);z-index:95;display:flex;
              align-items:center;justify-content:center;padding:28px;overflow-y:auto}
  .setup{background:#fff;border:1px solid var(--card-bd);border-radius:18px;width:100%;max-width:620px;
         padding:28px 32px 26px;box-shadow:0 14px 40px rgba(0,0,0,.18);font-family:var(--brandfont)}
  .setup h2{font-size:23px;font-weight:400;color:var(--dark);margin:0 0 8px}
  .setup p.sub{font-size:13.5px;color:var(--mid);line-height:1.55;margin:0 0 20px}
  .setup .field{max-width:none;margin-bottom:15px}
  .setup .field input{font-size:14px;padding:11px 13px}
  .setup-state{font-size:12.5px;padding:11px 13px;border-radius:11px;margin:0 0 18px;line-height:1.5}
  .setup-state.on{background:var(--succ-bg);border:1px solid var(--succ-bd);color:#12813F}
  .setup-state.off{background:var(--warn-bg);border:1px solid var(--warn-bd);color:#8A4A18}
  .setup-state.bad{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
  .setup-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .setup-btn{background:#fff;border:1px solid var(--card-bd);color:var(--mid);padding:11px 20px;
             border-radius:11px;font-family:inherit;font-size:14px;font-weight:700}
  .setup-btn:hover{border-color:var(--blue);color:var(--blue)}
  .setup-btn.go{background:var(--blue);border-color:var(--blue);color:#fff}
  .setup-btn.go:hover{background:#1570E6}
  .setup-hint{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.6}

  /* ============ BRIEFING OVERLAY ============ */
  .brief-veil{
    position:fixed;inset:0;background:rgba(18,18,58,.46);z-index:70;display:flex;
    align-items:center;justify-content:center;padding:28px;overflow-y:auto;
    animation:fadeIn .18s ease-out;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .brief{
    background:#fff;border:1px solid var(--card-bd);border-radius:18px;width:100%;max-width:660px;
    padding:32px 36px 30px;color:var(--dark);box-shadow:0 14px 40px rgba(0,0,0,.16);
    font-family:var(--brandfont);
  }
  .brief-h{font-size:27px;font-weight:400;color:var(--dark);line-height:1.15;margin:0 0 12px}
  .brief-l{font-size:14.5px;line-height:1.6;color:var(--mid);margin:0 0 24px}
  .brief .rules{margin-bottom:26px}
  .brief .rule{padding:12px 0}
  .brief .rule-t{font-size:14px}
  .brief .rule-t small{font-size:13px}
  .brief-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brief-foot .fineprint{margin:0}

  /* ============ ROUND 2 FULL WIDTH ============ */
  .axfull{flex:1;min-height:0;display:flex}
  .wb-cols{flex:1;min-height:0;display:flex}
  .wb-pdf{width:36%;min-width:290px;flex:none;border-right:1px solid #E4E2DD;
          display:flex;flex-direction:column;min-height:0;background:#EFEEEB}

function seeded(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
}
function addDays(iso, n){
  const d = new Date(Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)));
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function fillerLines(po, n, due){
  const r = seeded(po), base = Math.floor(r()*PARTS.length), out = [];
  for (let i=0;i<n;i++){
    const p = PARTS[(base + i*3) % PARTS.length];
    out.push({
      ln:(i+1)*10,
      part:p[0] + "-" + (1000 + Math.floor(r()*8999)),
      desc:p[1],
      qty:Math.max(1, Math.round(p[3] * (0.6 + r()*0.9))),
      price:+(p[2] * (0.85 + r()*0.35)).toFixed(2),
      date:addDays(due, Math.floor(r()*21))
    });
  }
  return out;
}

    if (l.ackDate  !== l.date)  out.push({po:p.po, li, field:"date",  from:l.date,  to:l.ackDate});
  }));
  return out;
}

  const t = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
};

function scoreManual(){
  const rows = ALL_DISC.map(d => {
    const cur = S.manual.erp[d.po].lines[d.li][d.field];
    const ok = d.field === "date" ? cur === d.to : Math.abs(Number(cur) - d.to) < 0.005;
    return Object.assign({}, d, {ok});
  });
  return {rows, found: rows.filter(r => r.ok).length};
}

/* Deterministic order-book statuses so the list looks the same every run. */
const ORD = POS.map(o => {
  if (o.po === PO) return {o, kind:"review"};
  const r = seeded(o.po + "s")();
  const kind = r < 0.42 ? "track" : r < 0.62 ? "shipped" : r < 0.78 ? "waiting" : r < 0.9 ? "risk" : "partial";
  return {o, kind};
});
const ORD_LABEL = {
  review:  ["review","Partially acknowledged"],
  track:   ["blue","On track"],
  shipped: ["green","Shipped"],
  waiting: ["blue","Waiting for order confirmation"],
  risk:    ["amber","At risk: not acknowledged yet"],
  partial: ["blue","Partially acknowledged"]
};
const ORD_ICON = {review:"\u25B6",track:"\u25B6",shipped:"\u{1F69A}",waiting:"\u25D5",risk:"!",partial:"\u25B6"};

      ? `An order confirmation came in overnight. Axya read it and found <b>${open.length} change${open.length>1?"s":""}</b> \u2014 open the flagged order to review them.`
      : `Every confirmation on this order book is reconciled.`}</span></div>
    <div class="ord-scroll">

        <th>Name</th><th>Users</th><th>Items</th><th>Supplier</th>

          const shipped = flag ? 0 : Math.max(0, total - (e.kind === "shipped" ? 0 : 1));
          const ring = shipped === total ? "full" : shipped ? "part" : "";
          const who = seeded(o.po)() < .5 ? "AP" : "YB";
          return `<tr class="${flag?"flagged":""}" data-a="open-order" data-po="${o.po}">

const key = d => d.po + "-" + d.li + "-" + d.field;
const findChange = li => ALL_DISC.find(d => d.li === li);
const openChanges = () => ALL_DISC.filter(d => !S.axya.dec[key(d)]);

/* one change is deliberately outside tolerance so the visitor sees the reject path */
const outOfTolerance = d => d.field === "price" && (d.to - d.from) / d.from > 0.10;

const dayGap = (a,b) => Math.round(
  (Date.UTC(+b.slice(0,4), +b.slice(5,7)-1, +b.slice(8,10)) -
   Date.UTC(+a.slice(0,4), +a.slice(5,7)-1, +a.slice(8,10))) / 86400000);

const TIP = {
  qty:  d => ["Quantity changed",
    "Confirmed quantity differs: PO " + d.from + " vs supplier " + d.to +
    " (" + (d.to > d.from ? "+" : "") + (d.to - d.from) + " units). Unit price and date agree."],
  price:d => {
    const delta = d.to - d.from, pct = (delta / d.from) * 100;
    return ["Unit price changed",
      "Unit price differs: PO " + money(d.from) + " vs supplier " + money(d.to) +
      ", up " + money(delta) + " per unit" + (Math.abs(pct) >= 1 ? " (" + pct.toFixed(1) + "%)" : "") +
      ". Quantity and date agree."];
  },
  date: d => {
    const g = dayGap(d.from, d.to);
    return ["Delivery date changed",
      "Delivery date shifted: PO " + d.from + " vs supplier " + d.to +
      " (" + Math.abs(g) + " day" + (Math.abs(g) === 1 ? "" : "s") + " " + (g > 0 ? "later" : "earlier") +
      "). Quantity and price agree."];
  }
};

/* ============================================================
   LEADERBOARD STORAGE
   Four tiers, chosen once at boot and never mixed:
     sheet - a Google Sheet behind an Apps Script endpoint. The record.
     live  - the artifact runtime's shared store (org-internal only)
     local - this machine only, for an offline booth laptop
     mem   - nothing persists (last resort)
   ============================================================ */
const BOARD_KEY = "axya-po-race-board";
const MISS_PENALTY = 30000;           // 30 s added per change you did not catch
let BOARD = [];
let STORE = "mem";
let DB = null;
let unsubBoard = null;
let pollT = null, polling = false;

/* The endpoint can be set three ways, in this order of priority:
     1. the page URL:  ...index.html?sheet=<exec url>&key=<key>
     2. whatever was saved on this machine through the setup panel
     3. the CONFIG block above
   So the file itself never has to be edited. */
const CFG_KEY = "axya-po-race-config";

function loadConfig(){
  try {
    const q = new URLSearchParams(location.search);
    const sheet = q.get("sheet"), k = q.get("key");
    if (sheet){
      CONFIG.SHEET_ENDPOINT = sheet;
      if (k) CONFIG.KEY = k;
      try { localStorage.setItem(CFG_KEY, JSON.stringify({SHEET_ENDPOINT:CONFIG.SHEET_ENDPOINT, KEY:CONFIG.KEY})); } catch(e){}
      return;
    }
  } catch(e){}
  try {
    const saved = JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
    if (saved.SHEET_ENDPOINT) CONFIG.SHEET_ENDPOINT = saved.SHEET_ENDPOINT;
    if (saved.KEY) CONFIG.KEY = saved.KEY;
  } catch(e){}
}

async function probe(endpoint, key){
  const url = endpoint + (endpoint.indexOf("?") < 0 ? "?" : "&") + "key=" + encodeURIComponent(key);
  const r = await fetch(url, {method:"GET"});
  if (!r.ok) throw new Error("The server answered " + r.status + ".");
  let j;
  try { j = await r.json(); }
  catch(e){ throw new Error("That URL did not return data. Check the deployment is set to Anyone."); }
  if (!j || !j.ok) throw new Error(j && j.error === "bad key" ? "Connected, but the key does not match the one in the script." : "The script answered with an error.");
  return (j.board || []).length;
}

async function reconnect(){
  if (pollT){ clearInterval(pollT); pollT = null; }
  if (unsubBoard){ try { unsubBoard(); } catch(e){} unsubBoard = null; }
  STORE = "mem"; DB = null; BOARD = [];
  await initStore();
}

async function grab(name){
  try {
    if (typeof window !== "undefined" && window.claude && window.claude.use) {
      return await window.claude.use(name);
    }
  } catch(e){}
  return null;
}

/* ---- Google Sheet transport ---- */
async function sheetGet(){
  const url = CONFIG.SHEET_ENDPOINT + (CONFIG.SHEET_ENDPOINT.indexOf("?") < 0 ? "?" : "&")
            + "key=" + encodeURIComponent(CONFIG.KEY);
  const r = await fetch(url, {method:"GET"});
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.board)) throw new Error("bad payload");
  return j.board;
}

async function sheetPost(entry){
  // text/plain keeps this a simple request, so the browser skips the CORS
  // preflight that Apps Script cannot answer.
  const r = await fetch(CONFIG.SHEET_ENDPOINT, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({key: CONFIG.KEY}, entry))
  });
  if (!r.ok) throw new Error("http " + r.status);
  return true;
}

async function refreshBoard(){
  if (polling) return;
  polling = true;
  try {
    const b = await sheetGet();
    if (JSON.stringify(b) !== JSON.stringify(BOARD)){
      BOARD = b;
      if (S.screen === "board") render();
    }
  } catch(e){}
  polling = false;
}

function startPolling(){
  if (pollT) return;
  pollT = setInterval(refreshBoard, Math.max(2000, CONFIG.POLL_MS));
}

async function initStore(){
  if (CONFIG.SHEET_ENDPOINT){
    try {
      BOARD = await sheetGet();
      STORE = "sheet";
      startPolling();
      if (S.screen === "board") render();
      return;
    } catch(e){ /* no endpoint reachable, fall through */ }
  }
  DB = await grab("db");
  if (DB){ STORE = "live"; subscribeBoard(); if (S.screen === "board") render(); return; }
  try {
    localStorage.setItem("__axya_t","1");
    localStorage.removeItem("__axya_t");
    STORE = "local";
    const raw = localStorage.getItem(BOARD_KEY);
    const seen = new Set(BOARD.map(e => e.ts));
    BOARD = (raw ? JSON.parse(raw) : []).concat(BOARD.filter(e => !seen.has(e.ts)));
  } catch(e){ STORE = "mem"; }
  if (S.screen === "board") render();
}

/* One subscription for the whole page, opened once at boot. */
function subscribeBoard(){
  if (unsubBoard || !DB) return;
  try {
    unsubBoard = DB.collection("scores").orderBy("adjMs").limit(200).onSnapshot(
      snap => {
        BOARD = snap.docs.map(d => Object.assign({}, d.data()));
        if (S.screen === "board") render();
      },
      () => { unsubBoard = null; STORE = "local"; }
    );
  } catch(e){ unsubBoard = null; STORE = "local"; }
}

async function saveEntry(entry){
  if (!BOARD.some(e => e.ts === entry.ts)) BOARD.push(entry);   // show it immediately
  if (STORE === "sheet"){
    try { await sheetPost(entry); setTimeout(refreshBoard, 600); return true; }
    catch(e){ return false; }
  }
  if (STORE === "live" && DB){
    const id = entry.ts + "-" + Math.random().toString(36).slice(2,8);
    try { await DB.collection("scores").doc(id).set(entry); return true; }
    catch(e){ return false; }
  }
  if (STORE === "local"){
    try { localStorage.setItem(BOARD_KEY, JSON.stringify(BOARD)); return true; } catch(e){ return false; }
  }
  return false;
}

const storeLabel = () =>
    STORE === "sheet" ? "Scores are written to the Axya leaderboard sheet and refresh live."
  : STORE === "live"  ? "Scores update live on every station running this page."
  : STORE === "local" ? "Scores are saved on this machine."
  : "Scores last until this page is reloaded.";

/* Round 1 is the only thing worth ranking: Axya finds every change every time.
   Rank on time, with a 30 second penalty for each change left in the ERP. */
const adjusted = e => e.manualMs + (e.total - e.found) * MISS_PENALTY;
const ranked = () => BOARD.slice().sort((a,b) => adjusted(a) - adjusted(b));

function buildCSV(){
  const rows = [["Rank","Name","Email","Consent","Changes found","Total","Round 1 time (s)",
                 "Penalty (s)","Adjusted (s)","Axya time (s)","When"]];
  ranked().forEach((e,i) => rows.push([
    i+1, e.name, e.email || "", e.email ? "yes" : "no",
    e.found, e.total, (e.manualMs/1000).toFixed(1),
    ((e.total-e.found)*MISS_PENALTY/1000).toFixed(0), (adjusted(e)/1000).toFixed(1),
    (e.axyaMs/1000).toFixed(1), new Date(e.ts).toISOString()
  ]));
  return rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
}

async function exportCSV(){
  const csv = buildCSV();
  const fname = "axya-po-race-" + new Date().toISOString().slice(0,10) + ".csv";
  const dl = await grab("downloads");
  if (dl){
    try { await dl.save({filename:fname, data:csv}); toast(BOARD.length + " entries exported"); }
    catch(e){ if (!e || e.code !== "declined") toast("Export is not available in this view"); }
    return;
  }
  try {
    const el = document.createElement("a");
    el.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    el.download = fname;
    el.click();
    URL.revokeObjectURL(el.href);
    toast(BOARD.length + " entries exported");
  } catch(e){ toast("Export is not available in this view"); }
}

    </div>
    <div class="field" id="f-email">
      <label for="in-email">Work email</label>
      <input type="email" id="in-email" autocomplete="email" placeholder="you@company.com">
      <div class="err">That does not look like an email address.</div>
    </div>
    <label class="consent">
      <input type="checkbox" id="in-consent" checked>
      <span>Axya can email me my result and get in touch about order management. Untick this and we drop the address, your score still goes on the board.</span>
    </label>
    <div class="cta-row">
      <button class="cta" data-a="save-score">Add my score</button>
      <button class="cta ghost" data-a="board">See the board without me</button>
    </div>
    <p class="storenote">${storeLabel()}</p>
  </div></div>`;
}

/* ============================================================
   SCREEN 7 — LEADERBOARD
   ============================================================ */
function screenBoard(){
  stopClock();
  const board = ranked();
  const mine = board.findIndex(e => e.ts === S.justAdded);
  const top = board.slice(0, 10);
  const showMine = mine >= 10 ? board[mine] : null;
  const row = (e,i) => `<tr class="${e.ts===S.justAdded?"me":""}">
      <td class="r-rank">${i+1}</td>
      <td class="r-name">${esc(e.name)}</td>
      <td class="r-num">${e.found} / ${e.total}</td>
      <td class="r-num">${clock(e.manualMs)}</td>
      <td class="r-num">${clock(adjusted(e))}</td>
    </tr>`;
  return `<div class="stage"><div class="stage-inner">
    <p class="kicker">Today at the booth</p>
    <h1 class="big" style="font-size:clamp(30px,4.2vw,48px);margin-bottom:14px">${
      mine === 0 ? "You are in first." :
      mine > 0 ? "You are number " + (mine+1) + "." : "Fastest runs so far"}</h1>
    <p class="lede" style="margin-bottom:28px">Ranked on round one, with thirty seconds added for every change left wrong in the ERP. Fast and wrong is how a date slips into your production plan.</p>
    ${board.length ? `<table class="board"><thead><tr>
        <th class="r-rank">#</th><th>Name</th>
        <th class="r-num">Found</th><th class="r-num">Time</th><th class="r-num">Adjusted</th>
      </tr></thead><tbody>
        ${top.map(row).join("")}
        ${showMine ? `<tr><td colspan="5" style="border:0;padding:6px 0;color:var(--muted)">\u00B7  \u00B7  \u00B7</td></tr>` + row(showMine, mine) : ""}
      </tbody></table>` : `<div class="board-empty">Nobody has finished a run yet.</div>`}
    <div class="cta-row">
      <button class="cta" data-a="restart">Next visitor</button>
    </div>
    <p class="storenote">${storeLabel()} ${BOARD.length} ${BOARD.length===1?"run":"runs"} recorded. Booth staff: Ctrl+Shift+E exports a CSV.</p>
  </div></div>`;
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render(){
  const app = $("#app");
  if (S.screen === "intro")        app.innerHTML = screenIntro();
  else if (S.screen === "manual")  { app.innerHTML = screenManual(); afterManual(); }
  else if (S.screen === "mres")    app.innerHTML = screenManualResult();
  else if (S.screen === "axya")    { app.innerHTML = screenAxya(); afterAxya(); }
  else if (S.screen === "final")   app.innerHTML = screenFinal();
  else if (S.screen === "signup")  { app.innerHTML = screenSignup(); const n = $("#in-name"); if (n) n.focus(); }
  else if (S.screen === "board")   app.innerHTML = screenBoard();
}

function wireSearch(mode){
  const box = $("#posearch");
  if (box) box.addEventListener("input", e => { $("#polist").innerHTML = poRows(mode, e.target.value); });
}
function afterManual(){
  if (S.manual.started) $("#prog").textContent = "No lines changed yet";
  $("#msglist").innerHTML = msgRows();
  wireSearch("manual");
}
function afterAxya(){ wireSearch("axya"); refreshAxya(); }

function editedCount(){
  return POS.filter(p => S.manual.erp[p.po].lines.some(l => Object.keys(l.touched).length)).length;
}

document.addEventListener("input", e => {
  const f = e.target.dataset.edit;
  if (!f) return;
  if (S.screen === "manual" && !S.manual.started) beginRound("manual");
  const li = +e.target.dataset.li, id = S.manual.po;
  const st = S.manual.erp[id].lines[li];
  st[f] = f === "date" ? e.target.value : (parseFloat(e.target.value) || 0);
  st.touched[f] = true;
  e.target.classList.add("touched");
  const s = $("#erpstatus");
  if (s) s.innerHTML = `<span class="saved">${id} line ${POBY[id].lines[li].ln} saved</span>`;
  const n = editedCount(), pr = $("#prog");
  if (pr) pr.textContent = n + (n === 1 ? " order changed" : " orders changed");
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const a = t.dataset.a;

  // Nothing on the work screens is dead: touching anything starts the clock.
  if (S.screen === "manual" && !S.manual.started) beginRound("manual");
  if (S.screen === "axya"   && !S.axya.started)   beginRound("axya");

  if (a === "start-manual"){ S.screen = "manual"; render(); }

  else if (a === "run-manual"){ /* handled by beginRound above */ }

  else if (a === "pick-po"){
    const mode = t.dataset.mode, id = t.dataset.po;
    S[mode].po = id;
    $("#polist").innerHTML = poRows(mode, ($("#posearch")||{}).value);
    $("#polines").innerHTML = lineRows(mode);
    $("#polines").scrollTop = 0;
    $("#linehead").textContent = "Order lines — " + id + " · " + POBY[id].supplier;
  }

  else if (a === "pick-msg"){
    S.manual.msg = +t.dataset.i;
    S.manual.read[t.dataset.i] = true;
    $("#msglist").innerHTML = msgRows();
    $("#msgread").innerHTML = msgRead();
    $("#msgread").scrollTop = 0;
    const u = INBOX.length - Object.keys(S.manual.read).length;
    const fc = $("#foldcount"); if (fc) fc.textContent = u || "";
    const ul = $("#olunread"); if (ul) ul.textContent = u ? u + " unread" : "No unread mail";
  }

  else if (a === "open-pdf")   $("#docslot").innerHTML = pdfSheet(+t.dataset.ack);
  else if (a === "open-other") $("#docslot").innerHTML = decoySheet(t.dataset.kind);
  else if (a === "close-doc")  $("#docslot").innerHTML = "";

  else if (a === "finish-manual"){
    stopClock();
    S.manual.ms = Date.now() - S.manual.t0;
    S.result = scoreManual();
    S.screen = "mres"; render();
  }

  else if (a === "start-axya"){ S.screen = "axya"; render(); }

  else if (a === "run-axya"){ /* handled by beginRound above */ }

  else if (a === "accept" || a === "reject"){
    const d = findDisc(t.dataset.k);
    decide(d, a === "accept" ? "acc" : "rej");
    S.axya.hl = d.li;
    refreshAxya();
    toast(a === "accept" ? "Order line updated in your ERP" : "Revision request sent to the supplier");
  }

  else if (a === "open-order"){
    S.axya.view = "bench";
    S.axya.viewPo = t.dataset.po;
    S.axya.hl = null;
    refreshAxya();
  }

  else if (a === "back-orders"){
    S.axya.view = "orders";
    S.axya.viewPo = null;
    S.axya.hl = null;
    refreshAxya();
  }

  else if (a === "toggle-row"){
    const k = t.dataset.k;
    S.axya.sel[k] = !S.axya.sel[k];
    refreshAxya();
  }

  else if (a === "toggle-all"){
    const open = openChanges(), all = open.every(d => S.axya.sel[key(d)]);
    open.forEach(d => S.axya.sel[key(d)] = !all);
    refreshAxya();
  }

  else if (a === "confirm-selected"){
    const picked = openChanges().filter(d => S.axya.sel[key(d)]);
    picked.forEach(d => decide(d, "acc"));
    S.axya.hl = null;
    refreshAxya();
    toast(picked.length + " line" + (picked.length>1?"s":"") + " updated in your ERP");
  }

  else if (a === "locate"){
    S.axya.hl = +t.dataset.li;
    refreshAxya();
  }

  else if (a === "finish-axya"){
    stopClock();
    S.axya.ms = Date.now() - S.axya.t0;
    S.screen = "final"; render();
  }

  else if (a === "to-signup"){
    S.screen = "signup"; render();
    if (STORE === "sheet") refreshBoard().then(() => { if (S.screen === "signup") render(); });
  }

  else if (a === "board"){ S.screen = "board"; render(); }

  else if (a === "save-score"){
    const name = $("#in-name").value.trim();
    const email = $("#in-email").value.trim();
    const consent = $("#in-consent").checked;
    const okName = name.length > 0;
    const okMail = email === "" || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    $("#f-name").classList.toggle("bad", !okName);
    $("#f-email").classList.toggle("bad", !okMail);
    if (!okName){ $("#in-name").focus(); return; }
    if (!okMail){ $("#in-email").focus(); return; }
    S.justAdded = Date.now();
    saveEntry({
      ts:S.justAdded, name,
      email:(consent && email) ? email : "",
      found:S.result.found, total:TOTAL,
      manualMs:S.manual.ms, axyaMs:S.axya.ms,
      adjMs:S.manual.ms + (TOTAL - S.result.found) * MISS_PENALTY
    }).then(ok => {
      if (!ok && STORE !== "mem") toast("Score shown but not saved");
      if (S.screen === "board") render();
    });
    S.screen = "board"; render();
  }

  else if (a === "setup-close"){ closeSetup(); }

  else if (a === "setup-test"){
    const url = $("#cfg-url").value.trim(), k = $("#cfg-key").value.trim();
    if (!url){ setupMsg("bad", "Paste the web app URL first."); return; }
    setupMsg("off", "Checking...");
    probe(url, k)
      .then(n => setupMsg("on", "Connected. The sheet currently holds " + n + " run" + (n===1?"":"s") + "."))
      .catch(err => setupMsg("bad", err.message || "Could not reach that URL."));
  }

  else if (a === "setup-save"){
    const url = $("#cfg-url").value.trim(), k = $("#cfg-key").value.trim();
    if (!url){ setupMsg("bad", "Paste the web app URL first."); return; }
    setupMsg("off", "Connecting...");
    probe(url, k).then(async n => {
      CONFIG.SHEET_ENDPOINT = url; CONFIG.KEY = k;
      try { localStorage.setItem(CFG_KEY, JSON.stringify({SHEET_ENDPOINT:url, KEY:k})); } catch(e){}
      await reconnect();
      setupMsg("on", "Connected. The sheet currently holds " + n + " run" + (n===1?"":"s") + ".");
      toast("Leaderboard connected");
    }).catch(err => setupMsg("bad", err.message || "Could not reach that URL."));
  }

  else if (a === "setup-clear"){
    try { localStorage.removeItem(CFG_KEY); } catch(e){}
    CONFIG.SHEET_ENDPOINT = "";
    reconnect().then(() => setupMsg("off", "Disconnected. Scores are saved on this machine only."));
  }

  else if (a === "restart"){ reset(); render(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeSetup(); const d = $("#docslot"); if (d) d.innerHTML = ""; }
  if (e.key === "Enter" && S.screen === "signup" && e.target.tagName === "INPUT"){
    e.preventDefault();
    const b = document.querySelector('[data-a="save-score"]');
    if (b) b.click();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === "K" || e.key === "k")){
    e.preventDefault();
    openSetup();
  }
  if (e.ctrlKey && e.shiftKey && (e.key === "E" || e.key === "e")){
    e.preventDefault();
    if (BOARD.length) exportCSV(); else toast("No scores recorded yet");
  }
});

reset();
loadConfig();
render();
initStore();
</script>
</body>
</html>
